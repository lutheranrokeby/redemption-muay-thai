        .btn-clip { clip-path: polygon(0 0, 90% 0, 100% 20%, 100% 100%, 0 100%); }
        .glass-card { background: rgba(45, 45, 45, 0.4); backdrop-filter: blur(10px); border: 1px solid rgba(132, 147, 150, 0.2); }

<body class="bg-background text-on-surface font-body-md overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
    <div id="root">

            <div style="margin-bottom: 1.5rem;">

                </h1>
                <p style="font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: #bac9cc; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 0.5rem;">

                </p>
            </div>
            
            <div style="width: 250px; height: 6px; background-color: #2a2a2a; border-radius: 9999px; overflow: hidden; border: 1px solid #3b494c;">
