<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Redemption Muay Thai</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-secondary-container": "#b4b5b5",
                        "on-tertiary-container": "#5a5959",
                        "on-tertiary": "#313030",
                        "surface-variant": "#353534",
                        "surface-dim": "#131313",
                        "on-surface": "#e5e2e1",
                        "on-primary": "#00363d",
                        "error": "#ffb4ab",
                        "charcoal-light": "#2D2D2D",
                        "outline": "#849396",
                        "secondary-fixed-dim": "#c6c6c7",
                        "background": "#131313",
                        "inverse-on-surface": "#313030",
                        "tertiary-container": "#d2d0cf",
                        "on-primary-fixed": "#001f24",
                        "primary-container": "#00e5ff",
                        "on-secondary-fixed-variant": "#454747",
                        "on-tertiary-fixed": "#1c1b1b",
                        "surface-container-highest": "#353534",
                        "on-tertiary-fixed-variant": "#474746",
                        "tertiary": "#efeceb",
                        "surface-bright": "#3a3939",
                        "on-error": "#690005",
                        "surface-container-low": "#1c1b1b",
                        "inverse-surface": "#e5e2e1",
                        "outline-variant": "#3b494c",
                        "danger-red": "#FF3B30",
                        "primary": "#c3f5ff",
                        "electric-cyan-muted": "rgba(0, 229, 255, 0.15)",
                        "secondary": "#c6c6c7",
                        "on-primary-container": "#00626e",
                        "on-background": "#e5e2e1",
                        "surface-container-lowest": "#0e0e0e",
                        "on-error-container": "#ffdad6",
                        "primary-fixed-dim": "#00daf3",
                        "on-surface-variant": "#bac9cc",
                        "secondary-container": "#454747",
                        "surface-tint": "#00daf3",
                        "inverse-primary": "#006875",
                        "surface-container": "#201f1f",
                        "secondary-fixed": "#e2e2e2",
                        "tertiary-fixed-dim": "#c8c6c5",
                        "tertiary-fixed": "#e5e2e1",
                        "error-container": "#93000a",
                        "primary-fixed": "#9cf0ff",
                        "surface": "#131313",
                        "surface-container-high": "#2a2a2a",
                        "on-secondary": "#2f3131",
                        "on-primary-fixed-variant": "#004f58",
                        "on-secondary-fixed": "#1a1c1c"
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px"
                    },
                    spacing: {
                        "section-gap": "8rem",
                        "gutter": "1.5rem",
                        "grid-margin": "2rem",
                        "stack-md": "1.5rem",
                        "stack-sm": "0.5rem",
                        "stack-lg": "3rem"
                    },
                    fontFamily: {
                        "label-mono": ["JetBrains Mono"],
                        "headline-lg": ["Anton"],
                        "button-text": ["Anton"],
                        "display-xl": ["Anton"],
                        "body-lg": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Anton"],
                        "body-md": ["Hanken Grotesk"],
                        "display-xl-mobile": ["Anton"],
                        "headline-md": ["Anton"]
                    },
                    fontSize: {
                        "label-mono": ["14px", { lineHeight: "100%", letterSpacing: "0.05em", fontWeight: "500" }],
                        "headline-lg": ["48px", { lineHeight: "110%", letterSpacing: "0.01em", fontWeight: "400" }],
                        "button-text": ["18px", { lineHeight: "100%", letterSpacing: "0.05em", fontWeight: "400" }],
                        "display-xl": ["96px", { lineHeight: "100%", letterSpacing: "0.02em", fontWeight: "400" }],
                        "body-lg": ["20px", { lineHeight: "160%", fontWeight: "400" }],
                        "headline-lg-mobile": ["32px", { lineHeight: "110%", letterSpacing: "0.01em", fontWeight: "400" }],
                        "body-md": ["16px", { lineHeight: "160%", fontWeight: "400" }],
                        "display-xl-mobile": ["56px", { lineHeight: "100%", letterSpacing: "0.02em", fontWeight: "400" }],
                        "headline-md": ["32px", { lineHeight: "120%", fontWeight: "400" }]
                    }
                }
            }
        }
    </script>
    <style>
        .clip-slant {
            clip-path: polygon(0 0, 100% 5%, 100% 100%, 0 100%);
        }
        .btn-clip {
            clip-path: polygon(0 0, 90% 0, 100% 20%, 100% 100%, 0 100%);
        }
        .glass-card {
            background: rgba(45, 45, 45, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(132, 147, 150, 0.2);
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">

<!-- TopNavBar Component from JSON -->
<nav class="bg-background/85 dark:bg-background/85 backdrop-blur-md fixed top-0 w-full z-50 border-b border-outline-variant dark:border-outline-variant shadow-[4px_4px_0px_0px_rgba(0,229,255,0.3)]">
<div class="flex justify-between items-center px-grid-margin py-4 max-w-full mx-auto">
<a class="font-headline-lg text-headline-lg text-primary dark:text-primary-fixed-dim italic tracking-widest uppercase" href="#">REDEMPTION</a>
<div class="hidden md:flex gap-8 items-center">
<a class="font-button-text text-button-text uppercase tracking-widest text-primary dark:text-primary-fixed-dim border-b-2 border-primary pb-1" href="#">Home</a>
<a class="font-button-text text-button-text uppercase tracking-widest text-on-surface dark:text-on-surface hover:text-primary transition-colors hover:bg-primary hover:text-on-primary dark:hover:bg-primary-container transition-all duration-300" href="#coaches">Coaches</a>
<a class="font-button-text text-button-text uppercase tracking-widest text-on-surface dark:text-on-surface hover:text-primary transition-colors hover:bg-primary hover:text-on-primary dark:hover:bg-primary-container transition-all duration-300" href="#classes">Classes</a>
<a class="font-button-text text-button-text uppercase tracking-widest text-on-surface dark:text-on-surface hover:text-primary transition-colors hover:bg-primary hover:text-on-primary dark:hover:bg-primary-container transition-all duration-300" href="#timetable">Schedule</a>
</div>
<button class="hidden md:block btn-clip bg-primary-container text-black font-button-text text-button-text px-6 py-3 uppercase tracking-widest hover:bg-white transition-colors">
                CONTACT
            </button>
<button class="md:hidden text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">menu</span>
</button>
</div>
</nav>

<!-- Hero Section -->
<header class="relative min-h-screen flex items-center justify-center pt-24 pb-12 overflow-hidden">
<div class="absolute inset-0 z-0 bg-surface-dim">
<img id="hero-bgImage" class="w-full h-full object-cover opacity-40 mix-blend-luminosity" src="" alt="Hero Background"/>
<div class="absolute inset-0 bg-gradient-to-t from-background via-background/60 to-transparent"></div>
</div>
<div class="relative z-10 container mx-auto px-grid-margin grid grid-cols-1 md:grid-cols-12 gap-gutter text-center">
<div class="md:col-span-10 md:col-start-2 flex flex-col items-center">
<h1 class="font-display-xl-mobile md:font-display-xl text-display-xl-mobile md:text-display-xl text-on-surface uppercase mb-stack-lg leading-none tracking-tight">
                    <span id="hero-titleLine1"></span> <br/><span id="hero-titleCyan" class="text-primary-container"></span><br/> <span id="hero-titleLine2"></span>
                </h1>
<div class="flex gap-4">
<button id="hero-cta1Text" class="btn-clip bg-primary-container text-black font-button-text text-button-text px-8 py-4 uppercase tracking-widest hover:bg-white transition-colors">
                    </button>
<button id="hero-cta2Text" class="border-2 border-primary-container text-primary-container font-button-text text-button-text px-8 py-4 uppercase tracking-widest hover:bg-primary-container hover:text-black transition-colors">
                    </button>
</div>
</div>
</div>
</header>

<!-- Welcome Section (Bento Grid) -->
<section class="py-section-gap px-grid-margin bg-background relative z-10 -mt-12 clip-slant shadow-[0_-20px_50px_rgba(0,0,0,0.5)]">
<div class="container mx-auto">
<div class="grid grid-cols-1 lg:grid-cols-12 gap-gutter">
<div class="lg:col-span-5 flex flex-col justify-center">
<h2 id="welcome-title" class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg uppercase text-primary mb-stack-md">
                    </h2>
<p id="welcome-paragraph1" class="text-on-surface-variant font-body-lg text-body-lg mb-stack-md">
                    </p>
<p id="welcome-paragraph2" class="text-on-surface-variant mb-stack-lg">
                    </p>
</div>
<div class="lg:col-span-7 grid grid-cols-1 sm:grid-cols-2 gap-4">
<div class="glass-card p-6 border-l-2 border-l-primary-container group hover:border-l-4 transition-all h-64 flex flex-col justify-end relative overflow-hidden">
<div class="absolute inset-0 bg-surface-container-high opacity-50 z-0"></div>
<span class="material-symbols-outlined text-4xl text-primary-container absolute top-6 right-6 z-10">sports_martial_arts</span>
<div class="relative z-10">
<h3 id="welcome-bento1Title" class="font-headline-md text-headline-md uppercase mb-2 text-white"></h3>
<p id="welcome-bento1Desc" class="text-sm text-on-surface-variant"></p>
</div>
</div>
<div id="welcome-bento2Card" class="glass-card p-6 border-l-2 border-l-primary-container group hover:border-l-4 transition-all h-64 flex flex-col justify-end relative overflow-hidden" style="background-image: url('')">
<div class="absolute inset-0 bg-black/70 group-hover:bg-black/50 transition-colors z-0"></div>
<div class="relative z-10">
<h3 id="welcome-bento2Title" class="font-headline-md text-headline-md uppercase text-primary-container mb-2"></h3>
<p id="welcome-bento2Desc" class="text-sm text-on-surface-variant"></p>
</div>
</div>
</div>
</div>
</div>
</section>

<!-- Features Section -->
<section id="classes" class="py-section-gap px-grid-margin bg-surface-container-low border-t border-charcoal-light">
<div class="container mx-auto">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg uppercase text-center mb-stack-lg text-white">Our Classes</h2>
<div id="classes-container" class="grid grid-cols-1 md:grid-cols-3 gap-gutter"></div>
<div class="mt-stack-lg text-center">
<a class="font-button-text text-button-text uppercase tracking-widest text-primary-container border-b border-primary-container hover:text-white hover:border-white transition-all pb-1" href="#">View Full Timetable</a>
</div>
</div>
</section>

<!-- Coaches Section -->
<section id="coaches" class="py-section-gap bg-background overflow-hidden">
<div class="container mx-auto px-grid-margin">
<div class="flex flex-col lg:flex-row items-center gap-stack-lg">
<div class="w-full lg:w-1/2 relative">
<div class="absolute inset-0 bg-primary-container translate-x-4 translate-y-4 z-0"></div>
<img id="coach-image" class="relative z-10 w-full h-[600px] object-cover filter contrast-125" src="" alt="Coach Image"/>
<div class="absolute top-8 -left-8 z-20 bg-black border border-primary-container p-4 transform -rotate-3">
<span id="coach-badge" class="font-label-mono text-label-mono text-primary-container"></span>
</div>
</div>
<div class="w-full lg:w-1/2 pl-0 lg:pl-12">
<h2 id="coach-name" class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg uppercase mb-2 text-white"></h2>
<h3 id="coach-subtitle" class="font-headline-md text-headline-md text-primary-container uppercase mb-stack-md"></h3>
<p id="coach-bio" class="text-on-surface-variant font-body-lg text-body-lg mb-6"></p>
<ul id="coach-achievements" class="space-y-4 mb-stack-lg"></ul>
<button class="btn-clip bg-primary-container text-black font-button-text text-button-text px-8 py-4 uppercase tracking-widest hover:bg-white transition-colors">
                        Train With Billy
                    </button>
</div>
</div>
</div>
</section>

<!-- Footer Component from JSON -->
<footer class="bg-surface-container-lowest dark:bg-surface-container-lowest w-full relative clip-path-slant border-t-4 border-primary dark:border-primary-fixed-dim">
<div class="grid grid-cols-1 md:grid-cols-3 gap-stack-lg px-grid-margin py-section-gap max-w-7xl mx-auto">
<div class="flex flex-col justify-between">
<div>
<h2 class="font-headline-md text-headline-md text-primary uppercase mb-4">REDEMPTION</h2>
<p id="footer-motto" class="font-body-md text-body-md dark:text-on-surface-variant mb-6 text-on-surface-variant"></p>
</div>
<p class="font-body-md text-body-md text-on-surface-variant text-sm mt-auto">
                    © 2024 REDEMPTION MUAY THAI.
                </p>
</div>
<div class="flex flex-col gap-4">
<h3 class="font-label-mono text-label-mono text-primary-container uppercase mb-2">Connect</h3>
<a id="footer-instagram" class="font-body-md text-body-md dark:text-on-surface-variant text-on-surface-variant hover:text-white transition-colors hover:translate-x-1 transition-transform inline-block focus:ring-1 focus:ring-primary w-fit" href="#">Instagram</a>
<a id="footer-facebook" class="font-body-md text-body-md dark:text-on-surface-variant text-on-surface-variant hover:text-white transition-colors hover:translate-x-1 transition-transform inline-block focus:ring-1 focus:ring-primary w-fit" href="#">Facebook</a>
</div>
<div class="flex flex-col gap-4">
<h3 class="font-label-mono text-label-mono text-primary-container uppercase mb-2">Contact</h3>
<a id="footer-location" class="font-body-md text-body-md dark:text-on-surface-variant text-on-surface-variant hover:text-white transition-colors hover:translate-x-1 transition-transform inline-block focus:ring-1 focus:ring-primary w-fit" href="#"></a>
<a id="footer-phone" class="font-body-md text-body-md dark:text-on-surface-variant text-on-surface-variant hover:text-white transition-colors hover:translate-x-1 transition-transform inline-block focus:ring-1 focus:ring-primary w-fit" href="#"></a>
<a id="footer-email" class="font-body-md text-body-md dark:text-on-surface-variant text-on-surface-variant hover:text-white transition-colors hover:translate-x-1 transition-transform inline-block focus:ring-1 focus:ring-primary w-fit" href="#"></a>
</div>
</div>
</footer>

<script>
async function loadPublicContent() {
    try {
        const res = await fetch('/api/content');
        const data = await res.json();
        
        document.getElementById('hero-titleLine1').innerText = data.hero.titleLine1;
        document.getElementById('hero-titleCyan').innerText = data.hero.titleCyan;
        document.getElementById('hero-titleLine2').innerText = data.hero.titleLine2;
        document.getElementById('hero-bgImage').src = data.hero.bgImage;
        document.getElementById('hero-cta1Text').innerText = data.hero.cta1Text;
        document.getElementById('hero-cta2Text').innerText = data.hero.cta2Text;

        document.getElementById('welcome-title').innerHTML = data.welcome.title.replace('Redemption', '<br/>Redemption');
        document.getElementById('welcome-paragraph1').innerText = data.welcome.paragraph1;
        document.getElementById('welcome-paragraph2').innerText = data.welcome.paragraph2;
        document.getElementById('welcome-bento1Title').innerText = data.welcome.bento1Title;
        document.getElementById('welcome-bento1Desc').innerText = data.welcome.bento1Desc;
        document.getElementById('welcome-bento2Title').innerText = data.welcome.bento2Title;
        document.getElementById('welcome-bento2Desc').innerText = data.welcome.bento2Desc;
        document.getElementById('welcome-bento2Card').style.backgroundImage = `url('${data.welcome.bento2Bg}')`;

        document.getElementById('classes-container').innerHTML = data.classes.map(c => `
            <div class="bg-surface relative group overflow-hidden border border-outline-variant hover:border-primary-container transition-colors">
                <div class="h-64 relative">
                    <img class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-500" src="${c.image}" alt="${c.title}" />
                    <div class="absolute inset-0 bg-gradient-to-t from-surface to-transparent"></div>
                    <div class="absolute top-0 right-0 h-full w-8 bg-black/50 flex items-center justify-center">
                        <span class="font-label-mono text-label-mono text-primary-container -rotate-90 whitespace-nowrap tracking-widest">${c.tag}</span>
                    </div>
                </div>
                <div class="p-6">
                    <h3 class="font-headline-md text-headline-md uppercase mb-4 text-primary">${c.title}</h3>
                    <p class="text-on-surface-variant mb-6 text-sm">${c.description}</p>
                    <a class="font-label-mono text-label-mono text-primary-container uppercase hover:text-white transition-colors flex items-center gap-2" href="#">
                        Explore <span class="material-symbols-outlined text-sm">arrow_forward</span>
                    </a>
                </div>
            </div>
        `).join('');

        document.getElementById('coach-name').innerText = data.coach.name;
        document.getElementById('coach-subtitle').innerText = data.coach.subtitle;
        document.getElementById('coach-badge').innerText = data.coach.badge;
        document.getElementById('coach-bio').innerText = data.coach.bio;
        document.getElementById('coach-image').src = data.coach.image;
        document.getElementById('coach-achievements').innerHTML = data.coach.achievements.map(a => `
            <li class="flex items-center gap-3">
                <span class="material-symbols-outlined text-primary-container">military_tech</span>
                <span class="font-label-mono text-label-mono text-on-surface">${a}</span>
            </li>
        `).join('');

        document.getElementById('footer-motto').innerText = data.footer.motto;
        document.getElementById('footer-location').innerText = data.footer.location;
        document.getElementById('footer-phone').innerText = data.footer.phone;
        document.getElementById('footer-email').innerText = data.footer.email;
    } catch (err) {
        console.error('Failed to load content', err);
    }
}
loadPublicContent();
</script>
</body>
</html>
